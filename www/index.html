<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B2C55">
<title>بيثيل اسمارت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone-width column, sticky brand header with role switch, fixed bottom tab bar, sheets slide up from the bottom. Colors follow the Bethel logo: navy + teal */
:root{
  --bg:#EDF2F6; --glow1:rgba(0,160,138,.20); --glow2:rgba(30,79,140,.16); --dots:rgba(11,44,85,.11); --card-sh:0 1px 2px rgba(15,34,56,.05),0 10px 26px rgba(15,34,56,.07); --surface:#FFFFFF; --sunk:#E9EEF2; --ink:#0F2238; --muted:#5B6A7A; --line:#D8E0E7;
  --brand:#0B2C55; --brand-ink:#FFFFFF; --accent:#00907C; --accent-soft:#D7F0EA;
  --ok:#1C8A4C; --ok-soft:#DDF2E5; --bad:#C2362B; --bad-soft:#FBE3E0; --warn:#A8690A; --warn-soft:#FBEFD6; --vac:#4A51A8; --vac-soft:#E5E7F7;
  --hi:rgba(255,255,255,.9); --brand-hi:#1E4F8C; --brand-deep:#061A33; --brand-glow:rgba(11,44,85,.28); --gold:#F2B21B; --gold-deep:#B97E06;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09121E; --glow1:rgba(43,189,163,.17); --glow2:rgba(70,120,220,.15); --dots:rgba(255,255,255,.06); --card-sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.25); --surface:#122033; --sunk:#192B42; --ink:#E3ECF4; --muted:#93A3B5; --line:#24364C;
  --brand:#2BBDA3; --brand-ink:#04211C; --accent:#3CCDB2; --accent-soft:#123A38;
  --ok:#4CC783; --ok-soft:#173826; --bad:#F06C60; --bad-soft:#3E1D1A; --warn:#E6A83C; --warn-soft:#3A2C12; --vac:#A9AEF0; --vac-soft:#23284D; --hi:rgba(255,255,255,.07); --brand-hi:#55DCC4; --brand-deep:#0E7564; --brand-glow:rgba(43,189,163,.25); --gold:#FFC93C; --gold-deep:#B98A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09121E; --glow1:rgba(43,189,163,.17); --glow2:rgba(70,120,220,.15); --dots:rgba(255,255,255,.06); --card-sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.25); --surface:#122033; --sunk:#192B42; --ink:#E3ECF4; --muted:#93A3B5; --line:#24364C;
  --brand:#2BBDA3; --brand-ink:#04211C; --accent:#3CCDB2; --accent-soft:#123A38;
  --ok:#4CC783; --ok-soft:#173826; --bad:#F06C60; --bad-soft:#3E1D1A; --warn:#E6A83C; --warn-soft:#3A2C12; --vac:#A9AEF0; --vac-soft:#23284D; --hi:rgba(255,255,255,.07); --brand-hi:#55DCC4; --brand-deep:#0E7564; --brand-glow:rgba(43,189,163,.25); --gold:#FFC93C; --gold-deep:#B98A10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0B2C55}
/* Background: soft teal and navy glows, a fading dot grid (like a field map), and the Bethel mark as a faint watermark */
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:radial-gradient(70% 45% at 100% 0%,var(--glow1),transparent 70%),radial-gradient(65% 50% at 0% 100%,var(--glow2),transparent 70%),radial-gradient(40% 30% at 15% 35%,var(--glow1),transparent 75%),var(--bg)}
#bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dots) 1.1px,transparent 1.4px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.5) 40%,transparent 80%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.5) 40%,transparent 80%)}
#bg img{position:absolute;width:300px;max-width:none;left:-70px;bottom:-40px;opacity:.06;transform:rotate(-12deg)}
.app{max-width:520px;margin:0 auto;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:#fff;border-radius:0 0 20px 20px;
  background:radial-gradient(80% 140% at 0% 0%,rgba(44,194,169,.35),transparent 60%),linear-gradient(120deg,#0B2C55 0%,#0E3F6E 55%,#0B7F6C 100%);
  box-shadow:0 8px 24px rgba(11,44,85,.28),inset 0 -1px 0 rgba(255,255,255,.08);
  padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 -2px 0 rgba(0,0,0,.08);display:grid;place-items:center;flex:none}
.logo img{width:30px;height:30px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.rolesel{font:inherit;font-size:12.5px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 8px;max-width:132px}
.rolesel option{color:#0F2238;background:#fff}
.bell{position:relative;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.bell b{position:absolute;top:-4px;left:-4px;background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
main{padding-top:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:grid;gap:14px}
h2{font-family:var(--f-display);font-size:20px;margin:0;font-weight:600;text-wrap:balance}
h3{font-family:var(--f-display);font-size:16px;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--card-sh);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
/* 3D buttons: lit top edge, solid "base" under the face, soft drop shadow; pressing pushes the face down onto its base */
.btn{--base:var(--line);--glow:rgba(15,34,56,.10);position:relative;font:inherit;font-weight:600;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;
  background:linear-gradient(180deg,var(--surface) 0%,var(--sunk) 100%);
  box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--base),0 6px 12px var(--glow);
  transition:transform .12s ease,box-shadow .12s ease,filter .15s;margin-bottom:3px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.04)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 var(--hi),0 0 0 var(--base),0 2px 4px var(--glow)}
.btn.pri{--base:var(--brand-deep);--glow:var(--brand-glow);background:linear-gradient(180deg,var(--brand-hi) 0%,var(--brand) 100%);color:var(--brand-ink);border-color:var(--brand-deep)}
.btn.acc{--base:#066B5C;background:linear-gradient(180deg,#2CC2A9,var(--accent));color:#fff;border-color:#066B5C}
.btn.big{width:100%;padding:15px;font-size:16.5px;font-family:var(--f-display);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 5px 0 var(--base),0 12px 22px var(--glow)}
.btn.big:active:not(:disabled){transform:translateY(5px)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px;box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--base),0 4px 8px var(--glow)}
.btn.sm:active:not(:disabled){transform:translateY(2px)}
.btn.danger{color:var(--bad);border-color:var(--bad);--base:var(--bad)}
.btn.okb{color:var(--ok);border-color:var(--ok);--base:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 3D icon tile: glossy gradient square, white glyph, inner bevel and colored shadow */
.tile{--c1:#2CC2A9;--c2:#0B7F6C;width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.45),transparent 45%),linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 9px color-mix(in srgb,var(--c2) 45%,transparent)}
.tile svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.tile.lg{width:46px;height:46px;border-radius:14px}.tile.lg svg{width:25px;height:25px}
.btn .tile{width:30px;height:30px;border-radius:9px}.btn .tile svg{width:17px;height:17px}
/* page transitions */
@keyframes inL{from{opacity:0;transform:translateX(-26px)}}
@keyframes inR{from{opacity:0;transform:translateX(26px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
main.anim-l>*{animation:inL .38s cubic-bezier(.2,.8,.2,1) both}
main.anim-r>*{animation:inR .38s cubic-bezier(.2,.8,.2,1) both}
main.anim-u>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
main[class*=anim]>*:nth-child(2){animation-delay:.04s}main[class*=anim]>*:nth-child(3){animation-delay:.08s}main[class*=anim]>*:nth-child(4){animation-delay:.12s}main[class*=anim]>*:nth-child(5){animation-delay:.16s}main[class*=anim]>*:nth-child(n+6){animation-delay:.2s}
/* target ring */
.target{display:grid;justify-items:center;gap:6px;text-align:center}
.ringsvg{display:block;max-width:100%;height:auto;overflow:visible}
.ringsvg .arc{animation:fillArc 1.1s cubic-bezier(.3,.8,.2,1) both}
@keyframes fillArc{from{stroke-dashoffset:var(--c)}}
.ringsvg.done .arc{filter:drop-shadow(0 0 6px var(--gold))}
.ringsvg text{fill:var(--ink);font-family:var(--f-display)}
.ringsvg .lbl{fill:var(--muted);font-family:var(--f-body)}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:26px}
.stars span{font-size:24px;line-height:1;color:var(--gold);text-shadow:0 2px 0 var(--gold-deep),0 4px 8px rgba(200,140,0,.35);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-40deg)}}
.mini{display:flex;align-items:center;gap:12px}
@media (prefers-reduced-motion:reduce){main[class*=anim]>*,.ringsvg .arc,.stars span{animation:none!important}.btn{transition:none}}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.vac{background:var(--vac-soft);color:var(--vac)}
.list{display:grid}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:19px;font-weight:600}
.stat .l{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
label.f,.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bar{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hbar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.hbar .bar{height:14px}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;border:1px solid var(--line)}
.av.lg{width:84px;height:84px;font-size:32px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:600}
.cal button{font:inherit;border:1px solid transparent;background:var(--sunk);color:var(--ink);border-radius:8px;aspect-ratio:1/1.08;max-width:100%;padding:3px 0;display:grid;align-content:center;justify-items:center;cursor:pointer;line-height:1.15}
.cal button .dn{font-size:11px;color:var(--muted)}
.cal button .c{font-family:var(--f-display);font-weight:600;font-size:15px}
.cal button.ok{background:var(--ok-soft)} .cal button.ok .c{color:var(--ok)}
.cal button.low{background:var(--bad-soft)} .cal button.low .c{color:var(--bad)}
.cal button.vac{background:var(--vac-soft)} .cal button.vac .c{color:var(--vac);font-size:11px}
.cal button.off{background:transparent;border-color:var(--line);color:var(--muted)}
.cal button.fut{background:transparent;border:1px dashed var(--line)}
.cal button.today{border:2px solid var(--accent)}
.cal button.sel{outline:2px solid var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px;background:var(--c)}
/* geofence */
.geo{display:grid;justify-items:center;gap:10px;padding:8px 0}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center}
.ring.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 3px var(--ok)}
.ring.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 3px var(--bad)}
.ring .dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700}
.ring.ok .dot{background:var(--ok)} .ring.bad .dot{background:var(--bad)}
.geo .msg{font-family:var(--f-display);font-weight:600;font-size:17px;text-align:center}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:2px 0 0}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -6px 20px rgba(15,34,56,.08);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;font:inherit;font-size:11px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 1px 9px;display:grid;justify-items:center;gap:2px;cursor:pointer;white-space:nowrap}
nav.tabs button .tile{width:34px;height:34px;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s,filter .2s;opacity:.6;filter:saturate(.55)}
nav.tabs button .tile svg{width:19px;height:19px}
nav.tabs .in.many button{font-size:10.5px}nav.tabs .in.many button .tile{width:31px;height:31px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .tile{opacity:1;filter:none;transform:translateY(-5px) scale(1.08)}
nav.tabs button:active .tile{transform:translateY(-1px) scale(.95)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(6,14,26,.5);z-index:20;animation:fade .2s ease;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;animation:up .2s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet,.ov{animation:none}}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.line-ed{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.line-ed .r3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
.pv{font-size:12px}.pv th,.pv td{padding:5px 6px}
.cols{display:flex;flex-wrap:wrap;gap:4px}.cols span{font-size:11.5px;background:var(--sunk);color:var(--muted);border-radius:6px;padding:1px 7px}
.netbar{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.netbar.on{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.netbar .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 20%,transparent)}
.netbar.off .dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;cursor:pointer;margin:0;border:0;padding:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--warn)}.switch input:checked::after{transform:translateX(-18px)}
.qitem{border-inline-start:3px solid var(--warn);padding-inline-start:10px}
@keyframes flyout{to{opacity:0;transform:translateY(-14px) scale(.96)}}
.qitem.fly{animation:flyout .45s ease forwards}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-left-color:transparent;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.netbar.off .dot,.qitem.fly,.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600;font-size:14px;max-width:90vw}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.thumb{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}
.big-num{font-family:var(--f-display);font-size:30px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv span:first-child{color:var(--muted)}
/* welcome letter */
.welcome{display:grid;gap:14px}
.welcome .plate{background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center;border:1px solid var(--line)}
.welcome .plate img{width:170px;max-width:100%;height:auto}
.welcome h2{font-size:23px;text-align:center}
.welcome .body p{margin:0 0 10px;font-size:15.5px;line-height:1.8;max-width:62ch}
.sign{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:2px}
.sign .who{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--brand)}
.sign a{color:var(--accent);font-weight:600;text-decoration:none;direction:ltr;justify-self:start}
footer.sig{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
footer.sig a{color:var(--accent);text-decoration:none;font-weight:600}

/* app shell additions */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
body.auth header,body.auth nav.tabs{display:none}
body.auth main{padding-block:28px 40px}
.login{display:grid;gap:16px;max-width:420px;margin:0 auto;width:100%}
.login .plate img{width:200px}
.btn{user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><img src="logo-mark.png" alt=""></div>
<div class="app">
  <header>
    <div class="logo"><img src="logo-mark.png" alt="شعار بيثيل"></div>
    <div class="brand">بيثيل اسمارت <small id="hsub">شركة النيل فارما</small></div>
    <div class="spacer"></div>
    <button class="bell" id="bell" aria-label="الإشعارات" onclick="openNotifs()" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <b id="bellN">0</b>
    </button>
    <button class="bell" id="userBtn" aria-label="الحساب" onclick="userMenu()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheetRoot"></div>
<script src="bundle.js"></script>
<script src="ui.js"></script>
</body>
</html>
