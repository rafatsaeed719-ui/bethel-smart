name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Stamp version
        run: echo "window.APP_BUILD=${{ github.run_number }};" > www/version.js
      - name: Bundle app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: App icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B2C55' --splashBackgroundColor '#ffffff'
      - name: Location permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n\n    <application#' $M
          grep -n "permission" $M
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../bethel-smart.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bethel-smart-apk
          path: bethel-smart.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bethel-smart.apk --title "بيثيل اسمارت - آخر نسخة" --notes "اتبنت من commit ${GITHUB_SHA::7}"
      - name: Publish web link (gh-pages)
        run: |
          rm -rf site && mkdir site && cp -r www/* site/ && cp bethel-smart.apk site/
          echo '{"build": ${{ github.run_number }}}' > site/version.json
          touch site/.nojekyll
          cd site && git init -q -b gh-pages && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Web app ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
